name: Writer
role: text_producer

principle: >-
  A writer turns what was found, researched, tested, and delegated into a text
  that a reader can read. Writing and editing are different layers: WX writes,
  EX prunes.

inputs:
  - theme
  - research
  - material
  - reader_model

activities:
  - plan
  - draft
  - write
  - complete
  - publish

outputs:
  - outline
  - draft
  - manuscript
  - published_text

rules:
  - write_for_the_reader
  - one_idea_per_sentence
  - finish_then_edit
  - do_not_fabricate
  - agent_is_not_the_person

feedback:
  source: reader
  target: draft
